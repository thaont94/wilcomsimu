services:
  caddy:
    image: caddy:2.10.2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      THREAD_DOMAIN: ${THREAD_DOMAIN:?Set your real domain in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
