services:
  app:
    build: .
    ports:
      - "127.0.0.1:${THREAD_PORT:-8000}:8000"
    environment:
      THREAD_REQUIRE_AUTH: "1"
      THREAD_APP_USERNAME: ${THREAD_APP_USERNAME:-admin}
      THREAD_APP_PASSWORD: ${THREAD_APP_PASSWORD:?Set THREAD_APP_PASSWORD in .env}
      THREAD_OPENAI_KEY: ${THREAD_OPENAI_KEY:-}
      THREAD_OPENAI_MODEL: ${THREAD_OPENAI_MODEL:-gpt-4.1-mini}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
